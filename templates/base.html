<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XLSense Dashboard</title>
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-light: #ecf0f1;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: #f4f7f6;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-item {
            padding: 15px 25px;
            text-decoration: none;
            color: var(--text-light);
            display: block;
        }

        .nav-item:hover {
            background-color: #34495e;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<nav class="sidebar">
    <h2>XLSense</h2>

    <div class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="nav-item">Dashboard</a>
        <a href="{% url 'manage_templates' %}" class="nav-item">Manage Templates</a>
        <a href="{% url 'upload_file' %}" class="nav-item">Upload File</a>
        <a href="#" class="nav-item">Domain Mapping</a>
        <a href="#" class="nav-item">Upload History</a>
    </div>

    <a href="{% url 'logout' %}" class="nav-item" style="color:#e74c3c;">Logout</a>
</nav>

<div class="main-content">
    <div class="top-bar">
        <h1>{% block title %}{% endblock %}</h1>
        <div>Welcome, <strong>{{ user.username }}</strong></div>
    </div>

    {% block content %}
    {% endblock %}
</div>

</body>
</html>
